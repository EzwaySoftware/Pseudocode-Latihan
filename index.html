<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Soal Pseudocode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

        body {
            font-family: 'Inter', sans-serif;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }

            animation: fadeIn 0.3s ease-out forwards;

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

            display: none !important;
        }
        input:checked ~ .dot {
            transform: translateX(100%);

            background-color: #10b981; /* emerald-500 */
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-3xl w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700">
        
        <!-- Header -->
        <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">
                    Pseudocode<span class="text-slate-100">Gen</span>
                </h1>
                <p class="text-sm text-slate-400 mt-1">Uji kemampuan logika algoritmamu</p>
            </div>
            <div id="score-container" class="hide text-right">
                <p class="text-sm text-slate-400">Skor / Benar</p>
                <p class="text-xl font-bold text-emerald-400" id="score-text">0</p>
            </div>
        </div>

        <div id="screen-start" class="p-8">
            <div class="text-center mb-8">
                <h2 class="text-xl font-semibold mb-2">Pilih Tingkat Kesulitan</h2>
                <p class="text-slate-400">Soal akan di-generate secara otomatis dan tidak pernah sama.</p>
            </div>
            
            <div class="flex items-center justify-center mb-8 gap-3">
                <label for="ai-toggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="ai-toggle" class="sr-only" onchange="toggleAI(this.checked)">
                        <div class="block-bg block bg-slate-600 w-14 h-8 rounded-full transition-colors"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition transform"></div>
                    </div>
                    <div class="ml-3 text-slate-300 font-medium flex items-center gap-2">
                        <span>Gunakan AI (Gemini)</span>
                        <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Baru</span>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="startGame('mudah')" class="p-6 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-emerald-500/10 hover:border-emerald-500 transition-all group text-left">
                    <h3 class="text-lg font-bold text-emerald-400 group-hover:text-emerald-300">🌱 Mudah</h3>
                    <p class="text-sm text-slate-300 mt-2">Aritmatika dasar dan manipulasi variabel sederhana.</p>
                </button>
                <button onclick="startGame('sedang')" class="p-6 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-blue-500/10 hover:border-blue-500 transition-all group text-left">
                    <h3 class="text-lg font-bold text-blue-400 group-hover:text-blue-300">⚙️ Sedang</h3>
                    <p class="text-sm text-slate-300 mt-2">Logika percabangan (if-else) dan perulangan dasar.</p>
                </button>
                <button onclick="startGame('sulit')" class="p-6 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-purple-500/10 hover:border-purple-500 transition-all group text-left">
                    <h3 class="text-lg font-bold text-purple-400 group-hover:text-purple-300">🔥 Sulit</h3>
                    <p class="text-sm text-slate-300 mt-2">Perulangan bersarang, manipulasi array, dan kondisi kompleks.</p>
                </button>
                <button onclick="startGame('sangat-sulit')" class="p-6 rounded-xl border border-slate-600 bg-slate-700/50 hover:bg-rose-500/10 hover:border-rose-500 transition-all group text-left">
                    <h3 class="text-lg font-bold text-rose-400 group-hover:text-rose-300">💀 Sangat Sulit</h3>
                    <p class="text-sm text-slate-300 mt-2">Algoritma khusus, simulasi rekursif, dan logika matematis tingkat lanjut.</p>
                </button>
            </div>
        </div>

        <div id="screen-quiz" class="hide flex flex-col h-full relative">
            
            <div id="loading-overlay" class="hide absolute inset-0 z-10 flex flex-col items-center justify-center bg-slate-800/80 backdrop-blur-sm rounded-2xl">
                <div class="w-12 h-12 border-4 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin mb-4"></div>
                <p class="text-emerald-400 font-medium animate-pulse">AI sedang meracik soal...</p>
            </div>

            <div id="quiz-content" class="flex flex-col h-full w-full transition-opacity duration-300">
                <div class="p-6 flex-grow">
                    <div class="flex justify-between items-center mb-4">
                        <span id="difficulty-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-slate-700 text-slate-300">Kesulitan</span>
                        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                        <span class="ml-2 text-xs text-slate-400 code-font">main.pseudo</span>
                    </div>
                    <div class="p-4 overflow-x-auto">
                        <pre id="code-block" class="block whitespace-pre-wrap"></pre>
                    </div>
                </div>

                <!-- Options -->
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Buttons generated dynamically -->
                </div>

                <!-- Feedback Area -->
                <div id="feedback-area" class="mt-6 p-4 rounded-xl hide">
                    <div class="flex items-start gap-3">
                        <div id="feedback-icon" class="text-2xl mt-1"></div>
                        <div>
                            <h4 id="feedback-title" class="font-bold text-lg"></h4>
                            <p id="feedback-desc" class="text-slate-300 text-sm mt-1"></p>
                        </div>
                    </div>
                    <div class="mt-4 text-right">
                        <button onclick="loadNextQuestion()" class="px-6 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold rounded-lg transition-colors">
                            Soal Selanjutnya ➔
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-700 bg-slate-800/50 flex justify-between rounded-b-2xl">
                <button onclick="resetGame()" class="text-sm text-slate-400 hover:text-white transition-colors">← Kembali ke Menu</button>
            </div>
            </div>
        </div>

    </div>

    <script>
        // --- State Management ---
        let currentDifficulty = '';
        let score = 0;
        let currentQuestionData = null;
        let isAnswered = false;
        let useAI = false;

        // UI Elements
        const screenStart = document.getElementById('screen-start');
        const screenQuiz = document.getElementById('screen-quiz');
        const scoreContainer = document.getElementById('score-container');
        const scoreText = document.getElementById('score-text');
        const difficultyBadge = document.getElementById('difficulty-badge');
        const codeBlock = document.getElementById('code-block');
        const optionsContainer = document.getElementById('options-container');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDesc = document.getElementById('feedback-desc');

        // --- Utility Functions ---
        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Generate 3 unique distractors alongside the correct answer
        function generateOptions(correctAnswer) {
            let options = new Set([correctAnswer]);
            let attempts = 0;
            
            while (options.size < 4 && attempts < 50) {
                let offset;
                let r = Math.random();
                if (r < 0.25) offset = rand(-5, -1);
                else if (r < 0.5) offset = rand(1, 5);
                else if (r < 0.75) offset = rand(-10, 10);
                else offset = (correctAnswer > 0) ? Math.floor(correctAnswer * rand(2, 3)) : rand(1, 20);
                
                let distractor = correctAnswer + offset;
                // Avoid identical values or non-integers if correct answer is integer
                if (distractor !== correctAnswer && Number.isInteger(correctAnswer) === Number.isInteger(distractor)) {
                    options.add(distractor);
                }
                attempts++;
            }
            
            // Fallback if loop failed to generate unique
            let current = 1;
            while(options.size < 4) {
                if(!options.has(correctAnswer + current)) options.add(correctAnswer + current);
                current++;
            }

            return shuffleArray(Array.from(options));
        }

        // --- Question Generators by Difficulty ---

        function generateMudah() {
            const types = ['basic_math', 'variable_swap'];
            const type = types[rand(0, types.length - 1)];
            
            let code = "";
            let answer = 0;
            let explanation = "";

            if (type === 'basic_math') {
                let a = rand(2, 20);
                let b = rand(2, 20);
                let ops = ['+', '-', '*'];
                let op = ops[rand(0, 2)];
                
                if (op === '+') { answer = a + b; }
                else if (op === '-') { 
                    if(b > a) [a, b] = [b, a]; // keep it positive for easy mode
                    answer = a - b; 
                }
                else if (op === '*') {
                    a = rand(2, 10); b = rand(2, 10);
                    answer = a * b;
                }

                code = `x <- ${a}\ny <- ${b}\nz <- x ${op} y\nCETAK z`;
                explanation = `Nilai x adalah ${a} dan y adalah ${b}. Operasi z adalah ${a} ${op} ${b} yang menghasilkan ${answer}.`;
            } else {
                let a = rand(10, 50);
                let b = rand(10, 50);
                code = `a <- ${a}\nb <- ${b}\ntemp <- a\na <- b\nb <- temp\nCETAK a`;
                answer = b;
                explanation = `Program di atas adalah algoritma penukaran nilai (swap) menggunakan variabel bantuan 'temp'. Nilai 'a' menjadi nilai awal 'b' yaitu ${b}.`;
            }

            return { code, answer, explanation, options: generateOptions(answer) };
        }

        function generateSedang() {
            const types = ['if_else', 'for_loop'];
            const type = types[rand(0, types.length - 1)];
            
            let code = "";
            let answer = 0;
            let explanation = "";

            if (type === 'if_else') {
                let x = rand(1, 20);
                let threshold = rand(10, 15);
                let valTrue = rand(50, 100);
                let valFalse = rand(1, 49);
                
                code = `x <- ${x}\nJIKA x > ${threshold} MAKA\n  hasil <- ${valTrue}\nSEBALIKNYA\n  hasil <- ${valFalse}\nAKHIR JIKA\nCETAK hasil`;
                
                if (x > threshold) {
                    answer = valTrue;
                    explanation = `Karena x (${x}) lebih besar dari ${threshold}, kondisi bernilai BENAR. Maka hasil = ${valTrue}.`;
                } else {
                    answer = valFalse;
                    explanation = `Karena x (${x}) TIDAK lebih besar dari ${threshold}, program masuk ke blok SEBALIKNYA. Maka hasil = ${valFalse}.`;
                }
            } else {
                let n = rand(3, 7);
                answer = 0;
                for(let i=1; i<=n; i++) answer += i;
                
                code = `jumlah <- 0\nUNTUK i DARI 1 SAMPAI ${n} LAKUKAN\n  jumlah <- jumlah + i\nAKHIR UNTUK\nCETAK jumlah`;
                explanation = `Perulangan berjalan dari 1 hingga ${n}. Ini adalah deret aritmatika: 1+2+...+${n} = ${answer}.`;
            }

            return { code, answer, explanation, options: generateOptions(answer) };
        }

        function generateSulit() {
            const types = ['array_filter', 'while_loop'];
            const type = types[rand(0, types.length - 1)];
            
            let code = "";
            let answer = 0;
            let explanation = "";

            if (type === 'array_filter') {
                // Ensure at least one even and one odd to make it not always 0
                let arr = [rand(1, 5)*2, rand(1, 5)*2 - 1, rand(1, 10), rand(1, 10)];
                arr = shuffleArray(arr); // shuffle array elements
                
                answer = 0;
                let evenNumbers = [];
                for(let i=0; i<arr.length; i++) {
                    if(arr[i] % 2 === 0) {
                        answer += arr[i];
                        evenNumbers.push(arr[i]);
                    }
                }
                
                code = `data <- [${arr.join(', ')}]\ntotal <- 0\nUNTUK SETIAP x DALAM data LAKUKAN\n  JIKA x MOD 2 == 0 MAKA\n    total <- total + x\n  AKHIR JIKA\nAKHIR UNTUK\nCETAK total`;
                explanation = `Program ini menjumlahkan angka genap (MOD 2 == 0) di dalam array. Angka genapnya adalah [${evenNumbers.join(', ')}], sehingga totalnya ${answer}.`;
            } else {
                let start = rand(2, 5);
                let target = rand(15, 25);
                let step = rand(2, 4);
                let current = start;
                answer = 0; // count iterations
                
                while(current < target) {
                    current += step;
                    answer++;
                }
                
                code = `x <- ${start}\nlangkah <- 0\nSELAMA x < ${target} LAKUKAN\n  x <- x + ${step}\n  langkah <- langkah + 1\nAKHIR SELAMA\nCETAK langkah`;
                explanation = `Perulangan 'while' berjalan selama x kurang dari target (${target}). Dimulai dari ${start} dan ditambah ${step} tiap iterasi. Dibutuhkan ${answer} langkah hingga x >= ${target}. Nilai akhir x adalah ${current}.`;
            }

            return { code, answer, explanation, options: generateOptions(answer) };
        }

        function generateSangatSulit() {
             const types = ['modulo_math', 'nested_loop'];
            const type = types[rand(0, types.length - 1)];
            
            let code = "";
            let answer = 0;
            let explanation = "";

            if (type === 'modulo_math') {
                let a = rand(30, 60);
                let b = rand(7, 15);
                
                // Similar to integer division or custom modulo
                let originalA = a;
                let count = 0;
                while (a >= b) {
                    a = a - b;
                    count++;
                }
                answer = a; // The remainder
                
                code = `a <- ${originalA}\nb <- ${b}\nSELAMA a >= b LAKUKAN\n  a <- a - b\nAKHIR SELAMA\nCETAK a`;
                explanation = `Algoritma ini adalah simulasi operasi Modulo (sisa bagi). Program terus mengurangi 'a' dengan 'b' selama 'a' lebih besar/sama dengan 'b'. Ekivalen dengan ${originalA} MOD ${b} = ${answer}. (Dilakukan pengurangan sebanyak ${count} kali).`;
            } else {
                let outer = rand(3, 5);
                answer = 0;
                
                code = `p <- 0\nUNTUK i DARI 1 SAMPAI ${outer} LAKUKAN\n  UNTUK j DARI 1 SAMPAI i LAKUKAN\n    p <- p + 1\n  AKHIR UNTUK\nAKHIR UNTUK\nCETAK p`;
                
                for(let i=1; i<=outer; i++) {
                    for(let j=1; j<=i; j++) {
                        answer++;
                    }
                }
                
                explanation = `Perulangan bersarang. Loop luar berjalan ${outer} kali. Loop dalam berjalan bergantung pada nilai 'i'. Iterasi: i=1 (1 kali), i=2 (2 kali), hingga i=${outer}. Ini ekivalen dengan deret segitiga: 1+2+...+${outer} = ${answer}.`;
            }

            return { code, answer, explanation, options: generateOptions(answer) };
        }

        // --- Game Controls ---

        function toggleAI(checked) {
            useAI = checked;
        }

        async function generateAIQuestion(difficulty) {
            const apiKey = "AIzaSyAWng_woVSZ6DSpiB8GdgRB21VKNgNvRqE";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            let difficultyDesc = "";
            if (difficulty === 'mudah') difficultyDesc = "Aritmatika dasar, deklarasi dan manipulasi variabel sederhana. Tidak ada perulangan kompleks.";
            if (difficulty === 'sedang') difficultyDesc = "Logika percabangan (JIKA-SEBALIKNYA) dasar dan perulangan (UNTUK/SELAMA) dasar 1 tingkat.";
            if (difficulty === 'sulit') difficultyDesc = "Perulangan bersarang, logika deret angka, atau manipulasi kondisi if yang sedikit menipu.";
            if (difficulty === 'sangat-sulit') difficultyDesc = "Algoritma khusus, simulasi modulo manual, rekursif fiktif, atau nested loop kompleks.";

            const prompt = `Buatkan 1 soal pilihan ganda tentang pseudocode tingkat ${difficulty}. 

PENTING UNTUK KODE PSEUDOCODE:
1. Kode HARUS terdiri dari beberapa baris (multiline) menggunakan \\n sebagai pemisah baris.
2. Jangan gabungkan kode menjadi 1 baris.

Format output WAJIB JSON murni tanpa markdown:
{
  "code": "PROGRAM HitungData\\nVAR a, b, c : INTEGER\\nFOR i = 1 TO 5 DO\\n  a = a + i\\nEND",
  "question": "Berapakah nilai akhir variabel a?",
  "options": ["10", "15", "20", "25"],
  "answer": 1,
  "explanation": "Penjelasan singkat"
}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "code": { "type": "STRING", "description": "Teks pseudocode" },
                            "answer": { "type": "INTEGER", "description": "Jawaban benarnya (angka integer)" },
                            "explanation": { "type": "STRING", "description": "Penjelasan langkah demi langkah" },
                            "options": {
                                "type": "ARRAY",
                                "items": { "type": "INTEGER" },
                                "description": "Persis 4 angka unik yang berbeda sebagai pilihan ganda, di mana salah satunya WAJIB adalah jawaban benar."
                            }
                        },
                        required: ["code", "answer", "explanation", "options"]
                    }
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0) {
                    const jsonText = result.candidates[0].content.parts[0].text;
                    let data = JSON.parse(jsonText);
                    
                    // Fallback to ensure valid options array
                    if (!data.options || !Array.isArray(data.options) || data.options.length !== 4) {
                        data.options = generateOptions(data.answer);
                    } else if (!data.options.includes(data.answer)) {
                        data.options[0] = data.answer;
                    }
                    
                    // Shuffle the generated options
                    data.options = shuffleArray(data.options);
                    
                    return data;
                }
            } catch (error) {
                console.error("AI Generation failed, falling back to procedural:", error);
            }
            
            // Fallback to procedural generator if AI fails
            return getQuestionGenerator(difficulty)();
        }

        function getQuestionGenerator(diff) {
            switch(diff) {
                case 'mudah': return generateMudah;
                case 'sedang': return generateSedang;
                case 'sulit': return generateSulit;
                case 'sangat-sulit': return generateSangatSulit;
                default: return generateMudah;
            }
        }

        function getDifficultyColor(diff) {
            switch(diff) {
                case 'mudah': return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
                case 'sedang': return 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                case 'sulit': return 'bg-purple-500/20 text-purple-400 border-purple-500/30';
                case 'sangat-sulit': return 'bg-rose-500/20 text-rose-400 border-rose-500/30';
                default: return 'bg-slate-700 text-slate-300';
            }
        }

        function startGame(diff) {
            currentDifficulty = diff;
            score = 0;
            scoreText.innerText = score;
            
            screenStart.classList.add('hide');
            screenQuiz.classList.remove('hide');
            scoreContainer.classList.remove('hide');
            
            let label = diff.replace('-', ' ').toUpperCase();
            difficultyBadge.innerText = label;
            difficultyBadge.className = `px-3 py-1 text-xs font-semibold rounded-full border ${getDifficultyColor(diff)}`;
            
            loadNextQuestion();
        }

        async function loadNextQuestion() {
            isAnswered = false;
            feedbackArea.classList.add('hide');
            
            const loadingOverlay = document.getElementById('loading-overlay');
            const quizContent = document.getElementById('quiz-content');
            
            if (useAI) {
                loadingOverlay.classList.remove('hide');
                quizContent.classList.add('opacity-30', 'pointer-events-none');
                
                currentQuestionData = await generateAIQuestion(currentDifficulty);
                
                loadingOverlay.classList.add('hide');
                quizContent.classList.remove('opacity-30', 'pointer-events-none');
            } else {
                const generator = getQuestionGenerator(currentDifficulty);
                currentQuestionData = generator();
            }
            
            // Render Code (Syntax highlighting with HTML escaping & safe regex)
            let formattedCode = currentQuestionData.code
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/(&lt;-|==|!=|&lt;|&gt;|\+|-|\*|\/|MOD)/g, '<span class="text-rose-400">$1</span>')
                .replace(/\b(CETAK|JIKA|MAKA|SEBALIKNYA|AKHIR|UNTUK|DARI|SAMPAI|LAKUKAN|SETIAP|DALAM|SELAMA)\b/g, '<span class="text-blue-400 font-bold">$1</span>')
                .replace(/\b(\d+)\b(?![^<]*>)/g, '<span class="text-emerald-400">$1</span>');
            
            codeBlock.innerHTML = formattedCode;
            
            // Render Options
            optionsContainer.innerHTML = '';
            currentQuestionData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-4 text-left font-medium rounded-xl border border-slate-600 bg-slate-700/40 hover:bg-slate-600 transition-all animate-fade-in flex items-center gap-4';
                btn.style.animationDelay = `${index * 0.05}s`;
                
                // Add letter prefix (A, B, C, D)
                const letter = String.fromCharCode(65 + index);
                
                btn.innerHTML = `<span class="flex-shrink-0 w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-400 font-bold border border-slate-600">${letter}</span> <span class="text-lg">${opt}</span>`;
                btn.onclick = () => checkAnswer(btn, opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(clickedBtn, selectedAnswer) {
            if (isAnswered) return;
            isAnswered = true;
            
            const isCorrect = (selectedAnswer === currentQuestionData.answer);
            const allBtns = optionsContainer.querySelectorAll('button');
            
            // Update score
            if (isCorrect) {
                score++;
                scoreText.innerText = score;
                // Animate score slightly
                scoreText.classList.add('scale-125');
                setTimeout(() => scoreText.classList.remove('scale-125'), 200);
            }
            
            // Styling buttons to show correct/wrong
            allBtns.forEach(btn => {
                btn.onclick = null; // disable clicks
                btn.classList.remove('hover:bg-slate-600');
                
                const btnVal = parseInt(btn.innerText.substring(2)); // Extract number from "A \n 12" string - better way is to compare with data
                const actualVal = parseInt(btn.querySelectorAll('span')[1].innerText);

                if (actualVal === currentQuestionData.answer) {
                    btn.classList.replace('border-slate-600', 'border-emerald-500');
                    btn.classList.replace('bg-slate-700/40', 'bg-emerald-500/20');
                    btn.querySelector('.w-8').classList.replace('bg-slate-800', 'bg-emerald-500');
                    btn.querySelector('.w-8').classList.replace('text-slate-400', 'text-white');
                    btn.querySelector('.w-8').classList.replace('border-slate-600', 'border-emerald-500');
                } else if (btn === clickedBtn && !isCorrect) {
                    btn.classList.replace('border-slate-600', 'border-rose-500');
                    btn.classList.replace('bg-slate-700/40', 'bg-rose-500/20');
                    btn.querySelector('.w-8').classList.replace('bg-slate-800', 'bg-rose-500');
                    btn.querySelector('.w-8').classList.replace('text-slate-400', 'text-white');
                    btn.querySelector('.w-8').classList.replace('border-slate-600', 'border-rose-500');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            // Show feedback
            feedbackArea.classList.remove('hide');
            if (isCorrect) {
                feedbackArea.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/30');
                feedbackArea.classList.remove('bg-rose-500/10', 'border-rose-500/30');
                feedbackIcon.innerText = '✅';
                feedbackTitle.innerText = 'Tepat Sekali!';
                feedbackTitle.className = 'font-bold text-lg text-emerald-400';
            } else {
                feedbackArea.classList.add('bg-rose-500/10', 'border', 'border-rose-500/30');
                feedbackArea.classList.remove('bg-emerald-500/10', 'border-emerald-500/30');
                feedbackIcon.innerText = '❌';
                feedbackTitle.innerText = 'Jawaban Kurang Tepat';
                feedbackTitle.className = 'font-bold text-lg text-rose-400';
            }
            feedbackDesc.innerText = currentQuestionData.explanation;
        }

        function resetGame() {
            screenStart.classList.remove('hide');
            screenQuiz.classList.add('hide');
            scoreContainer.classList.add('hide');
        }
    </script>
</body>
</html>
